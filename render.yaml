# Render Blueprint — declara a config de build/deploy do web service como código, mesma
# disciplina spec-driven do resto do projeto. NÃO contém segredos: variáveis marcadas
# `sync: false` precisam ser preenchidas manualmente no dashboard do Render (ver o todolist em
# specs/deploy/fase-7-deploy-render.md).
#
# Chaves com UNDERSCORE, não ponto (achado real, 2026-08-25, ver
# specs/deploy/fase-7-deploy-render.md, "Causa raiz confirmada"): o Render descarta
# silenciosamente qualquer env var cujo nome tenha ponto — não chega no processo de jeito
# nenhum (confirmado via endpoint de diagnóstico temporário, PRs #10/#11). O CodeIgniter 4 já
# prevê isso: `BaseConfig::getEnvValue()` tenta a forma com ponto (`database.tidbcloud.hostname`
# — a usada no `.env` local, sem mudança) E a forma com underscore
# (`database_tidbcloud_hostname`) como fallback. Usar underscore aqui resolve sem tocar em
# nenhum Config/*.php nem no `.env` de dev.
services:
  - type: web
    name: devfinder-codeigniter
    runtime: docker
    plan: free
    dockerfilePath: ./docker/render/Dockerfile
    dockerContext: .
    healthCheckPath: /
    preDeployCommand: php spark migrate --no-interaction
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: app_baseURL
        sync: false # https://<seu-servico>.onrender.com/ — só se sabe depois do 1º deploy
      - key: database_defaultGroup
        value: tidbcloud
      - key: database_tidbcloud_hostname
        sync: false
      - key: database_tidbcloud_database
        value: devfinder
      - key: database_tidbcloud_username
        sync: false
      - key: database_tidbcloud_password
        sync: false
      - key: database_tidbcloud_port
        value: "4000"
      - key: encryption_key
        sync: false
      - key: auth_jwtSecret
        sync: false
      - key: auth_jwtExpirySeconds
        value: "604800"
      - key: auth_githubClientId
        sync: false
      - key: auth_githubClientSecret
        sync: false
      - key: auth_webURL
        sync: false
      - key: videorefresh_jsonbinApiKey
        sync: false
      - key: videorefresh_jsonbinIdSubs
        sync: false
